<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Jornada do Amor</title>
<!--
=====================================================================
 A JORNADA DO AMOR — a missão para encontrar Mary
 Arquivo único: HTML + CSS + JavaScript puro. Sem cadastro, sem
 servidores externos, nenhum dado sai do aparelho.

 COMO EDITAR (tudo fica no <script>, em blocos comentados):
  • Textos da carta ............ constante LETTER
  • Perguntas e falas das fases . constante LEVELS
  • Falas da introdução ........ constante INTRO
  • Falas do reencontro ........ constante REUNION
  • Falas aleatórias da Gertrudes: GERT_OK / GERT_NO / GERT_NO2
  • Nomes e cores dos personagens: CHARS

 COMO TROCAR OS DESENHOS (sprites):
  Os personagens são pixel art desenhada em código (constante SPR).
  Para usar uma imagem sua (PNG), preencha CUSTOM_IMAGES, por exemplo:
     matheus: "matheus.png"           (arquivo na mesma pasta)
  ou um data-URI. Se a foto/imagem do Matheus for incorporada ao projeto,
  REMOVA ou troque antes de publicar em um endereço público.
=====================================================================
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--rose:#f7b6c8;--wine:#6b1d3a;--wine2:#3e0f23;--cream:#fff3dc;--gold:#e8b64a;--lilac:#b79bd9;--forest:#2f6b3a;--night:#16204a;--pink:#e0488a}
html,body{margin:0;height:100%;background:#150c1f;font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;color:#3a1426;overflow:hidden}
#game{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:#2a1a3a;box-shadow:0 0 40px #000a}
#bg,#fx{position:absolute;inset:0}
#fx{pointer-events:none;z-index:30;overflow:hidden}
#bg .sky{position:absolute;inset:0}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
.ff{position:absolute;width:5px;height:5px;background:#fff7a0;box-shadow:0 0 8px 3px #ffe96b;border-radius:50%;animation:ff 3s ease-in-out infinite alternate}
@keyframes ff{from{transform:translate(0,0);opacity:.2}to{transform:translate(14px,-18px);opacity:1}}
.torch{position:absolute;font-size:30px;animation:flick .4s steps(2) infinite alternate;filter:drop-shadow(0 0 10px #ff9a2a)}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.15) rotate(3deg)}}
#view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:54px;z-index:5}
#view.in{animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hud{position:absolute;top:0;left:0;right:0;height:54px;padding:6px 8px;display:flex;align-items:center;gap:6px;z-index:8;background:linear-gradient(#000a,#0000)}
.hud.off{display:none}
.hbtn{width:44px;height:44px;border:3px solid var(--wine2);background:var(--cream);border-radius:8px;font-size:20px;box-shadow:0 3px 0 var(--wine2);cursor:pointer;padding:0}
.ttl{flex:1;text-align:center;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 var(--wine2);line-height:1.1}
.sc{background:var(--cream);border:3px solid var(--wine2);border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.spr{display:block;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(2px 0 0 #2a1320) drop-shadow(-2px 0 0 #2a1320) drop-shadow(0 2px 0 #2a1320) drop-shadow(0 -2px 0 #2a1320)}
.btn{font:inherit;font-weight:800;font-size:17px;min-height:50px;padding:10px 18px;border:3px solid var(--wine2);background:var(--pink);color:#fff;border-radius:8px;box-shadow:0 4px 0 var(--wine2);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wine2)}
.btn.sec{background:var(--cream);color:var(--wine);text-shadow:none}
.btn.big{width:100%;font-size:20px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.panel{margin:0 8px calc(8px + env(safe-area-inset-bottom));background:var(--cream);border:4px solid var(--wine);border-radius:10px;box-shadow:0 0 0 3px var(--gold),0 6px 0 3px var(--wine2);padding:12px;max-height:62%;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.dlg{display:flex;gap:10px;align-items:flex-start}
.portrait{flex:0 0 58px;width:58px;height:58px;border:3px solid var(--wine);border-radius:8px;background:#f6dcea;overflow:hidden;padding:2px}
.portrait .spr{filter:none}
.bubble{flex:1}
.nm{display:inline-block;color:#fff;font-weight:800;font-size:13px;padding:2px 10px;border-radius:6px;margin-bottom:4px;letter-spacing:.5px}
.bubble p{margin:0;font-size:17px;line-height:1.35}
.q{font-weight:800;font-size:18px;color:var(--wine);line-height:1.25}
.show{font-size:30px;text-align:center;background:#fff;border:2px dashed var(--lilac);border-radius:8px;padding:6px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-size:16px;min-height:52px;padding:8px 10px;border:3px solid var(--wine);background:#fff;border-radius:8px;color:#3a1426;cursor:pointer;box-shadow:0 3px 0 var(--wine)}
.opt b{flex:0 0 28px;height:28px;border-radius:6px;background:var(--lilac);color:#fff;display:flex;align-items:center;justify-content:center}
.opt.ok{background:#37b36a;color:#fff;border-color:#1c6b3d;box-shadow:0 3px 0 #1c6b3d}
.opt.no{background:#e4dede;color:#8a8080;text-decoration:line-through}
.fb{border-radius:8px;padding:8px 10px;font-size:15.5px;line-height:1.35}
.fb.good{background:#d8f5e2;border:2px solid #37b36a}
.fb.bad{background:#fde1e6;border:2px solid #e0587a}
.tip{display:flex;gap:8px;align-items:center;background:#e7f7e2;border:2px dashed #3fae4a;border-radius:8px;padding:6px 8px;font-size:14.5px}
.tip .mini{flex:0 0 34px;width:34px;height:34px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;padding:0 10px 4px;gap:6px}
.actor{animation:breathe 2.4s ease-in-out infinite;transform-origin:bottom center;flex:0 0 auto}
.actor.me{width:clamp(66px,22vw,108px);aspect-ratio:16/22}
.actor.gert{width:clamp(44px,13vw,66px);aspect-ratio:1;margin-right:auto;margin-left:-6px;margin-bottom:4%}
.actor.npc{width:clamp(96px,34vw,170px);aspect-ratio:1}
.actor.mary{width:clamp(66px,22vw,108px);aspect-ratio:16/22}
.stage.small .actor.me{width:clamp(50px,15vw,74px)}.stage.small .actor.npc{width:clamp(60px,20vw,100px)}.stage.small .actor.gert{width:44px}
.stage.single{justify-content:center;align-items:center}
.actor.big{width:clamp(130px,44vw,210px);aspect-ratio:1;animation:breathe 2.4s ease-in-out infinite}
.actor.big.tall{aspect-ratio:16/22;width:clamp(100px,32vw,150px)}
.bigemoji{font-size:90px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-4px) scaleY(1.02)}}
.talk{animation:talk .45s ease-in-out infinite alternate!important}
@keyframes talk{to{transform:translateY(-8px)}}
.cheer{animation:cheer .8s ease-out!important}
@keyframes cheer{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-9px) rotate(4deg)}}
.confused{animation:conf .9s ease-in-out!important}
@keyframes conf{25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}}
.surprise{animation:surp .6s ease-out!important}
@keyframes surp{20%{transform:translateY(-14px) scale(1.12)}40%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.bossbar{position:absolute;top:2px;left:10px;right:10px;background:#0009;border:3px solid #fff;border-radius:8px;padding:4px 8px;color:#fff;font-weight:800;font-size:12px}
.bossbar i{display:block;height:12px;background:#3a1020;border-radius:4px;margin-top:3px;overflow:hidden}
.bossbar i b{display:block;height:100%;background:linear-gradient(90deg,#ff4a6e,#ffb347);transition:width .8s}
.findarea{position:absolute;inset:0 0 0 0;touch-action:manipulation}
.fi{position:absolute;font-size:30px;line-height:1;transform:translate(-50%,-50%);background:none;border:0;padding:6px;cursor:pointer;filter:saturate(.65) brightness(.85)}
.fi.got{filter:none;animation:cheer .8s;pointer-events:none}
.fi.pulse{animation:pul .7s infinite alternate;filter:drop-shadow(0 0 8px #fff)}
@keyframes pul{to{transform:translate(-50%,-50%) scale(1.35)}}
.bush{position:absolute;font-size:34px;pointer-events:none;transform:translate(-50%,-50%);opacity:.95}
.find-hud{position:absolute;top:2px;left:8px;background:var(--cream);border:3px solid var(--wine);border-radius:8px;padding:4px 10px;font-weight:800;z-index:3}
.map{flex:1;position:relative;min-height:0}
.map svg.line{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.node .ic{width:58px;height:58px;margin:0 auto;border:4px solid var(--wine);background:var(--cream);border-radius:50%;overflow:hidden;box-shadow:0 3px 0 var(--wine2);padding:3px}
.node .ic .spr{filter:none}
.node .lb{display:block;margin-top:3px;background:var(--cream);border:2px solid var(--wine);border-radius:6px;font-size:11px;font-weight:800;padding:1px 4px;line-height:1.15}
.node.open .ic{border-color:var(--gold);animation:glow 1.1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 6px #ffe08a99,0 3px 0 var(--wine2)}}
.node.lock .ic{filter:grayscale(1) brightness(.7)}.node.lock .lb{opacity:.7}
.node.done .ic{border-color:#37b36a}
.node .tag{position:absolute;top:-6px;right:8px;font-size:20px}
.marker{position:absolute;width:56px;transform:translate(-50%,-92%);z-index:4;pointer-events:none}
.marker .me2{width:42px;aspect-ratio:16/22;margin:0 auto}
.marker.walk{transition:left 1.5s linear,top 1.5s linear}
.marker.walk .me2{animation:walk .25s steps(2) infinite}
@keyframes walk{50%{transform:translateY(-4px) rotate(3deg)}}
.mapbar{margin:0 8px calc(8px + env(safe-area-inset-bottom));background:var(--cream);border:4px solid var(--wine);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700}
.bag{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:22px}
.title{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:6px 14px calc(14px + env(safe-area-inset-bottom));gap:8px}
.logo{text-align:center;margin-top:8px}
.logo h1{margin:0;font-size:clamp(34px,11vw,56px);line-height:.95;color:var(--cream);text-transform:uppercase;font-weight:900;text-shadow:0 3px 0 var(--wine),0 6px 0 var(--wine2),0 0 18px #ff5fa088;-webkit-text-stroke:2px var(--wine2)}
.logo p{margin:10px auto 0;display:inline-block;background:var(--wine);color:var(--cream);font-weight:800;padding:4px 12px;border:3px solid var(--gold);border-radius:6px;font-size:14px}
.cast{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-height:0}
.cast .back{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.cast .front{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-top:-10px}
.cast .c{animation:breathe 2.6s ease-in-out infinite}
.menu{display:flex;flex-direction:column;gap:10px}
.modal{position:absolute;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--cream);border:4px solid var(--wine);border-radius:12px;box-shadow:0 0 0 3px var(--gold);padding:16px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px;width:100%}
.modal h2{margin:0;color:var(--wine)}.modal ul{margin:0;padding-left:20px;line-height:1.5}
.reward{align-items:center;text-align:center}
.reward .rwe{font-size:64px;animation:cheer 1.2s infinite}
.reun{position:relative;justify-content:center}
.hug{display:flex;align-items:flex-end;justify-content:center;position:relative;margin-bottom:6px}
.hug .a{width:clamp(80px,26vw,120px);aspect-ratio:16/22;animation:hug 2s ease-in-out infinite alternate}
.hug .a.m2{animation-name:hug2}
@keyframes hug{from{transform:translateX(-26px)}to{transform:translateX(8px)}}
@keyframes hug2{from{transform:translateX(26px)}to{transform:translateX(-8px)}}
.hug .bh{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:40px;animation:cheer 1.6s infinite}
.pets{display:flex;align-items:flex-end;justify-content:center;gap:0;position:absolute;left:0;right:0;bottom:2px}
.pets .p{width:clamp(48px,15vw,76px);aspect-ratio:1;animation:breathe 2.3s ease-in-out infinite}
.paper{background:#f7e4bd;border:4px solid #8a5a30;border-radius:6px;padding:16px 14px;overflow:auto;margin:0 8px;flex:1;min-height:0;box-shadow:0 6px 0 #5a3a20;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.5;color:#4a2a1a}
.paper p{margin:0 0 12px;white-space:pre-wrap}
.paper .sign{text-align:right;font-style:italic}
.letterbar{padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--lilac);font-weight:700}
.ans{background:#fff;border:2px solid var(--lilac);border-radius:8px;padding:6px 8px;font-size:14.5px}
input.txt{font:inherit;font-size:16px;padding:10px;border:3px solid var(--wine);border-radius:8px;width:100%;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14.5px;font-weight:700;padding:8px 10px;border:2px solid var(--wine);background:#fff;border-radius:16px;cursor:pointer;min-height:40px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--wine);color:#fff;padding:8px 14px;border-radius:8px;z-index:50;font-weight:700;border:2px solid var(--gold);max-width:90%;text-align:center}
.p-fx{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.bubble p{font-size:15.5px}.opt{min-height:46px;font-size:15px}.actor.gert{margin-bottom:2%}}
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div>
  <div id="hud" class="hud off"></div>
  <main id="view"></main>
  <div id="fx" aria-hidden="true"></div>
</div>
<noscript>Este jogo precisa de JavaScript para funcionar.</noscript>

<script src="config.js"></script>
<script>
'use strict';
/* ================================================================
   1) DADOS EDITÁVEIS
   ================================================================ */

/* Para usar imagens suas no lugar da pixel art, preencha aqui (ex.: matheus:"matheus.png") */
const CUSTOM_IMAGES = { matheus:"", mary:"", luna:"", stella:"", frida:"", gertrudes:"", chico:"" };

const CHARS = {
  matheus:  {name:"Matheus",  color:"#3b6fd8", crop:[0,12]},
  mary:     {name:"Mary",     color:"#d8478f", crop:[0,12]},
  luna:     {name:"Luna",     color:"#7c9a68", crop:[0,14]},
  stella:   {name:"Stella",   color:"#d8873a", crop:[0,14]},
  frida:    {name:"Frida",    color:"#a8683a", crop:[0,16]},
  gertrudes:{name:"Gertrudes",color:"#2f9e4a", crop:[0,16]},
  chico:    {name:"Chico",    color:"#2b5fb8", crop:[0,16]},
  narrador: {name:"Narrador", color:"#6b1d3a"}
};

/* Falas aleatórias da Gertrudes */
const GERT_OK = [
  "Aff! Você está ficando bom demais nisso. Assim não tem graça!",
  "Foi sorte. Só pode ter sido sorte.",
  "Hmpf. Eu ia falar a resposta certa. Juro."
];
const GERT_NO = [
  "EU AVISEI! Quer dizer... não avisei nada, mas a culpa não foi minha!",
  "Viu? Eu falei que... bom, eu não falei nada. Mas errou!",
  "Tá vendo? Mais um motivo pra desistir e voltar pra casa comigo."
];
const GERT_NO2 = [
  "Se você perder essa fase, podemos voltar para casa e assistir televisão. Só nós dois. Sem princesas.",
  "Desiste, Matheus! Eu tenho pipoca e um sofá só pra nós dois."
];

/* Introdução: [quem, texto] */
const INTRO = [
  ["narrador","No alto de um reino encantado, uma princesa esperava por alguém muito especial..."],
  ["mary","Estarei aqui te esperando... Você consegue chegar até mim? Eu acredito em você! ❤️"],
  ["matheus","Eu vou conseguir, Mary. Não importa quantos desafios apareçam no caminho. Eu vou chegar até você."],
  ["gertrudes","Matheus, vamos buscar sua humana favorita! Quer dizer... sua segunda humana favorita. Eu continuo em primeiro lugar, né?"],
  ["narrador","Mas um papagaio muito ciumento, o Chico, já tinha um plano para impedir a missão..."],
  ["chico","Cachorras! Guardem cada canto do reino! Ninguém chega até a Mary!"],
  ["narrador","Luna, Stella e Frida passaram a guardar a floresta, o castelo dos brinquedos e a ponte. A aventura começa agora!"]
];

/* Reencontro */
const REUNION = [
  ["mary","Você conseguiu, amor... Passou por todos os desafios, conheceu nossos filhos e chegou até mim. ❤️"],
  ["matheus","Eu disse que ia chegar. Nada neste reino ia me impedir de te encontrar."],
  ["chico","Posso receber um carinho também? Prometo que agora eu me comporto."],
  ["mary","Claro que pode, Chico. Tem carinho para todo mundo!"],
  ["gertrudes","Está bem, Matheus. Pode ficar com a Mary. Mas quero deixar registrado que eu estava aqui primeiro!"],
  ["narrador","E, no jardim, todos ficaram juntos, em família. Mary tinha uma última surpresa guardada..."]
];

/* Carta final (um parágrafo por item). Edite à vontade. */
const LETTER = [
  "Para o amor da minha vida ❤️",
  "Meu amor,",
  "Se você chegou até aqui, é porque nem mesmo a Gertrudes, as cachorras e o Chico conseguiram impedir você de chegar até mim. 😂❤️",
  "Brincadeiras à parte, eu queria aproveitar esse pequeno presente para te lembrar de uma coisa: eu tenho muito orgulho de você.",
  "Tenho orgulho de quem você é, de tudo o que você enfrenta e de cada vez que tenta seguir em frente, mesmo quando as coisas não são fáceis. Quero que você nunca se esqueça do quanto é importante para mim e do quanto eu acredito em você.",
  "Eu amo dividir a vida com você, sonhar com o nosso futuro e imaginar todas as coisas que ainda vamos construir juntos. Não precisamos ter tudo resolvido hoje. Para mim, o que importa é continuarmos caminhando lado a lado, aprendendo, crescendo e escolhendo um ao outro todos os dias.",
  "Se eu pudesse voltar no tempo e escolher novamente alguém para compartilhar a minha vida, escolheria você outra vez.",
  "Porque, entre todas as pessoas que eu poderia encontrar pelo caminho, eu não poderia ter escolhido alguém melhor para chamar de meu amor, meu companheiro e amor da minha vida.",
  "Eu te amo mais do que consigo colocar em palavras. E espero que, em cada fase da nossa história, você nunca tenha dúvidas de que tem alguém aqui torcendo por você, acreditando em você e sonhando com um futuro ao seu lado.",
  "Com todo o meu amor,",
  "Mary ❤️"
];

/* Fases. Tipos de passo: say | quiz | find | ask
   quiz: opts (3), ok (índice certo), fb (feedback de cada opção), tip (dica da Gertrudes, pode ser falsa), show (emojis grandes) */
const LEVELS = {
  luna:{ title:"Floresta dos Segredos", sub:"Luna, a espertinha", bg:"forest", npc:"luna",
    wrongLine:"Hum... achei que você prestasse mais atenção em mim!",
    reward:{e:"🍃",n:"Folha dos Segredos",t:"A Luna confia em você. Quase."},
    steps:[
      {t:"say", lines:[["luna","Eu? Não sei de nada. Essa comida apareceu sozinha!"],["matheus","Luna... eu nem perguntei nada ainda. 🤨"],["luna","Eu sou muito inocente. A Gertrudes é que não presta!"],["gertrudes","Eu?! Que calúnia! Eu só sou... uma ave de palavra."]]},
      {t:"find", prompt:"Ajude o Matheus a encontrar os objetos que a Luna pegou do chão!",
        items:[{e:"🧦",n:"meia",x:18,y:38},{e:"🍪",n:"biscoito",x:70,y:30},{e:"🥕",n:"cenourinha",x:46,y:62},{e:"🍞",n:"pão",x:84,y:66}],
        npcMiss:"Ali não tem nada. Eu juro. Você tem provas de que eu peguei isso do chão?", npcFound:"Isso estava ali por acaso! Eu nem vi.", hint:"Procure perto das moitas... ou não. Eu nunca sei de nada!"},
      {t:"quiz", q:"Qual é o talento secreto da Luna?", tip:"Confia em mim. Eu sou uma ave de palavra. Só não prometi que seriam palavras verdadeiras. (A resposta é a A!)",
        opts:["Ser a cachorra mais obediente do mundo.","Comer coisas do chão e fingir que não sabe de nada.","Ficar quietinha no cantinho dela."], ok:1,
        fb:["Obediente? Até a Luna riu dessa. 😂","Isso mesmo! Ela engole e faz cara de paisagem. 🕵️","Quietinha? Só se for planejando o próximo petisco. 😅"]},
      {t:"quiz", q:"Quem são os humanos favoritos da Luna?",

const _cache = {};
function pixelSVG(rows, pal, crop){
  const r0 = crop ? crop[0] : 0, r1 = crop ? Math.min(crop[1], rows.length) : rows.length;
  const w = rows[0].length, h = r1 - r0; let out = "";
  for (let y = r0; y < r1; y++){
    const row = rows[y]; let x = 0;
    while (x < w){
      const ch = row[x];
      if (ch === "."){ x++; continue; }
      let x2 = x; while (x2 < w && row[x2] === ch) x2++;
      out += '<rect x="'+x+'" y="'+(y-r0)+'" width="'+(x2-x)+'" height="1" fill="'+pal[ch]+'"/>';
      x = x2;
    }
  }
  return '<svg class="spr" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'+out+'</svg>';
}
function sprite(n, o){
  o = o || {};
  if (CUSTOM_IMAGES[n]) return '<img class="spr" src="'+CUSTOM_IMAGES[n]+'" alt="'+CHARS[n].name+'">';
  const key = n + (o.head ? ":h" : "");
  if (!_cache[key]){
    const S = SPR[n];
    _cache[key] = pixelSVG(S.rows, S.pal, o.head ? CHARS[n].crop : null);
  }
  return _cache[key];
}

const KEY = "jornada-do-amor-v1";
function fresh(){ return {pending:null,sentSnap:null,started:false,done:{},hearts:0,pts:0,right:0,first:0,total:0,items:[],opt:{},reunion:false,pos:"start",animFrom:null}; }
function load(){ try{ const j = JSON.parse(localStorage.getItem(KEY)); return Object.assign(fresh(), j||{}); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ================================================================
   4b) ENVIO DAS RESPOSTAS PARA A MARY (opcional, via Formspree)
   O endereço fica em config.js. Se estiver vazio, nada é enviado.
   Se a internet cair, o envio fica na fila e é refeito depois.
   ================================================================ */
const CFG = window.JORNADA_CONFIG || {};
const LABELS = {sonho:"Sonho ao lado da Mary", lembranca:"Lembrança que faz sorrir", admira:"O que mais admiro na Mary", promessa:"Promessa para o futuro"};
let sending = false;
function queueSend(){
  const snap = JSON.stringify(S.opt);
  if(!Object.keys(S.opt).some(k=>S.opt[k])) return;
  if(S.sentSnap===snap) return;
  S.pending = snap; save(); trySend();
}
function trySend(){
  if(!CFG.FORMSPREE_URL || !S.pending || sending) return;
  sending = true;
  const sent = S.pending, opt = JSON.parse(sent);
  const body = {_subject:"💌 Respostas do Matheus — A Jornada do Amor"};
  Object.keys(LABELS).forEach((k,i)=>{ body[(i+1)+". "+LABELS[k]] = opt[k] || "(não respondeu)"; });
  body["5. Enviado em"] = new Date().toLocaleString("pt-BR");
  fetch(CFG.FORMSPREE_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)})
    .then(r=>{ if(r.ok){ S.sentSnap = sent; if(S.pending===sent) S.pending = null; save(); } })
    .catch(()=>{})
    .then(()=>{ sending = false; });
}
window.addEventListener("online", trySend);

/* ================================================================
   5) SOM (opcional, começa desligado)
   ================================================================ */
const Snd = {
  ctx:null, on:false, tm:null, n:0,
  init(){ if(this.ctx) return; try{ const C = window.AudioContext||window.webkitAudioContext; this.ctx = new C(); }catch(e){} },
  tone(f,d,type,v,t){ const c=this.ctx; if(!c) return; const o=c.createOscillator(), g=c.createGain(); const n=c.currentTime+(t||0);
    o.type=type||"square"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,n); g.gain.linearRampToValueAtTime(v||0.04,n+0.01); g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g); g.connect(c.destination); o.start(n); o.stop(n+d+0.05); },
  sfx(k){ if(!this.on||!this.ctx) return;
    if(k==="ok"){ this.tone(660,.1,"square",.05); this.tone(880,.18,"square",.05,.1); }
    else if(k==="no"){ this.tone(200,.25,"sawtooth",.04); }
    else if(k==="win"){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.2,"square",.05,i*.12)); }
    else if(k==="blip"){ this.tone(440,.05,"square",.025); } },
  start(){ if(!this.ctx||this.tm) return;
    const mel=[523,659,784,659,880,784,659,587, 523,587,659,784,659,587,523,392], bass=[131,131,110,110,87,87,98,98];
    this.tm=setInterval(()=>{ if(!this.on) return; const i=this.n++; this.tone(mel[i%16],.22,"square",.022);
      if(i%2===0) this.tone(bass[Math.floor(i/2)%8],.45,"triangle",.05); },260); },
  stop(){ clearInterval(this.tm); this.tm=null; },
  toggle(){ this.init(); if(!this.ctx) return; if(this.ctx.state==="suspended") this.ctx.resume();
    this.on=!this.on; if(this.on) this.start(); else this.stop(); }
};
document.addEventListener("visibilitychange",()=>{ if(document.hidden) Snd.stop(); else if(Snd.on) Snd.start(); });

  const doneN = ORDER.filter(k=>S.done[k]).length;

const cur = ()=>Run.L.steps[Run.i];
function next(){ Run.i++; step(); }
function bossBar(){ return Run.L.boss ? '<div class="bossbar">Ciúme do Chico<i><b id="hp" style="width:'+Run.hp+'%"></b></i></div>' : ''; }
function stageLevel(sp, small){
  const L = Run.L;
  return '<div class="stage'+(small?" small":"")+'">'+bossBar()
   +'<div class="actor me '+(sp==="matheus"?"talk":"")+'" id="me">'+sprite("matheus")+'</div>'
   +'<div class="actor gert '+(sp==="gertrudes"?"talk":"")+'">'+sprite("gertrudes")+'</div>'
   +(L.npc?'<div class="actor npc '+(sp===L.npc?"talk":"")+'">'+sprite(L.npc)+'</div>':'')
   +'</div>';

function step(){
  const s = cur();
  if(!s){ return screenReward(); }
  Run.tries=0; Run.solved=false; Run.counted=false; Run.misses=0; Run.found=0; Run.line=0;
  if(s.t==="say") return viewSay(s);
  if(s.t==="quiz") return viewQuiz(s);
  if(s.t==="find") return viewFind(s);
  if(s.t==="ask") return viewAsk(s);
}
function viewSay(s){
  runLines(s.lines, (w,d,b)=>stageLevel(w)+'<div class="panel">'+d+'<div class="row">'+b+'</div></div>', ()=>next(), false);
  if(s.mood) setTimeout(()=>mood(s.mood),200);
}
/* executor genérico de falas */
function runLines(lines, frame, done, skip){ LR={lines,i:0,frame,done,skip}; drawLine(); }
function drawLine(){
  const l = LR.lines[LR.i], last = LR.i===LR.lines.length-1;
  show(LR.frame(l[0], dlg(l[0],l[1]), '<button class="btn" data-act="lr">'+(last?"Continuar »":"»")+'</button>'+(LR.skip?'<button class="btn sec" data-act="lrSkip" style="flex:0 0 auto">Pular</button>':"")));
  Snd.sfx("blip");
}

   +'<div class="opts" id="opts">'+opts+'</div><div id="fb" aria-live="polite"></div><div class="row" id="act"></div></div>');
}
function finishQuiz(){ document.getElementById("act").innerHTML='<button class="btn big" data-act="qnext">Continuar »</button>'; }
function onPick(btn){
  if(Run.solved) return;
  const s=cur(), i=+btn.dataset.i, L=Run.L;
  if(!Run.counted){ S.total++; Run.counted=true; }
  const fb=document.getElementById("fb");
  if(i===s.ok){
    Run.solved=true; btn.classList.add("ok");
    S.right++; S.hearts++; const first=Run.tries===0; if(first) S.first++; S.pts += first?10:5;
    if(s.hit!=null){ Run.hp=Math.max(0,Run.hp-s.hit); const hp=document.getElementById("hp"); if(hp) hp.style.width=Run.hp+"%"; }
    fb.innerHTML='<div class="fb good">'+s.fb[i]+(first?' <b>+10 ✨</b>':' <b>+5 ✨</b>')+'</div>'+(Math.random()<.6?'<div class="fb" style="background:#eef8ea">🦜 <b>Gertrudes:</b> '+pick(GERT_OK)+'</div>':'');
    document.querySelectorAll("#opts .opt").forEach(o=>o.disabled=true);
    mood("cheer"); burst(10); Snd.sfx("ok"); finishQuiz(); hud(L.title); save();
  } else {
    Run.tries++; btn.classList.add("no"); btn.disabled=true;
    fb.innerHTML='<div class="fb bad"><b>'+(L.npc?CHARS[L.npc].name:"Gertrudes")+':</b> “'+L.wrongLine+'”<br>'+s.fb[i]+'</div><div class="fb" style="background:#eef8ea">🦜 <b>Gertrudes:</b> '+(Run.tries>=2?pick(GERT_NO2):pick(GERT_NO))+'</div>';
    mood("confused"); Snd.sfx("no");
    if(Run.tries>=2 && !document.getElementById("showans")) document.getElementById("act").innerHTML='<button class="btn sec" id="showans" data-act="showans">Mostrar a resposta e continuar</button>';
  }
}
function showAnswer(){
  const s=cur(); Run.solved=true;
  document.querySelectorAll("#opts .opt").forEach((o,i)=>{ o.disabled=true; if(i===s.ok){o.classList.remove("no");o.classList.add("ok");} });
  document.getElementById("fb").innerHTML='<div class="fb good">'+s.fb[s.ok]+'</div>';
  if(s.hit!=null){ Run.hp=Math.max(0,Run.hp-s.hit); const hp=document.getElementById("hp"); if(hp) hp.style.width=Run.hp+"%"; }
  finishQuiz();
}
/* ---------- encontrar objetos ---------- */
function viewFind(s){
  const L=Run.L, bushes = [];
  const r = rng(Run.id.length*13+5);
  s.items.forEach((it,k)=>{ bushes.push('<span class="bush" style="left:'+(it.x+4)+'%;top:'+(it.y+5)+'%">'+(L.bg==="forest"?"🌿":"🌼")+'</span>'); });
  for(let i=0;i<6;i++) bushes.push('<span class="bush" style="left:'+Math.floor(r()*92+4)+'%;top:'+Math.floor(r()*80+8)+'%">'+(L.bg==="forest"?"🌲":"🌸")+'</span>');
  const items = s.items.map((it,k)=>'<button class="fi" data-act="fi" data-k="'+k+'" style="left:'+it.x+'%;top:'+it.y+'%" aria-label="'+it.n+'">'+it.e+'</button>').join("");
  show('<div class="stage small"><div class="find-hud" id="fh">🔍 <span id="fc">0</span>/'+s.items.length+'</div><div class="findarea" data-act="fmiss">'+items+bushes.join("")+'</div>'
   +(L.npc?'<div class="actor npc" style="position:absolute;right:4px;bottom:0;pointer-events:none">'+sprite(L.npc)+'</div>':'')
   +'<div class="actor me" id="me" style="position:absolute;left:4px;bottom:0;pointer-events:none">'+sprite("matheus")+'</div></div>'
   +'<div class="panel"><div class="q">'+s.prompt+'</div><div id="fb" aria-live="polite" class="fb" style="background:#fff">Toque nos objetos escondidos! Procure bem. 👀</div><div class="row" id="act"></div></div>');
  const area=document.querySelector(".findarea"); area.style.pointerEvents="auto";
}
function onFound(btn){
  const s=cur(), k=+btn.dataset.k;
  if(btn.classList.contains("got")) return;
  btn.classList.add("got"); btn.classList.remove("pulse"); Run.found++;
  document.getElementById("fc").textContent=Run.found;
  S.pts+=3; hud(Run.L.title); burst(4,["✨","💗"]); Snd.sfx("ok");
  document.getElementById("fb").innerHTML='<b>Achou: '+s.items[k].n+'!</b> '+(s.npcFound?'“'+s.npcFound+'”':'');
  if(Run.found>=s.items.length) endFind(true);
}
function onMissFind(){
  const s=cur(); if(Run.found>=s.items.length) return;
  Run.misses++;
  document.getElementById("fb").innerHTML='<b>'+(Run.L.npc?CHARS[Run.L.npc].name:"Gertrudes")+':</b> “'+s.npcMiss+'”';
  const act=document.getElementById("act"); let h="";
  if(Run.misses>=2) h+='<button class="btn sec" data-act="hint">💡 Dica da Gertrudes</button>';
  if(Run.misses>=4) h+='<button class="btn sec" data-act="fskip">Pular desafio »</button>';
  act.innerHTML=h; mood("confused");
}
function endFind(ok){
  const act=document.getElementById("act");
  document.getElementById("fb").className="fb good";
  document.getElementById("fb").innerHTML=ok?'<b>Você achou tudo! +💗</b> Gertrudes: “Aff! Você está ficando bom demais nisso. Assim não tem graça!”':'Tudo bem, vamos em frente!';
  if(ok){ S.hearts++; S.pts+=5; hud(Run.L.title); mood("cheer"); burst(12); Snd.sfx("win"); }
  act.innerHTML='<button class="btn big" data-act="qnext">Continuar »</button>'; save();
}
/* ---------- perguntas opcionais ---------- */
/* grava o que está escrito no campo (usado ao digitar, ao tocar numa sugestão, em Guardar e em Pular) */
function commitAns(){
  const f=document.getElementById("ans"); if(!f||!Run||!cur()||cur().t!=="ask") return;
  const v=f.value.trim(), id=cur().id;
  if(v) S.opt[id]=v; else delete S.opt[id];
  save();
}
function viewAsk(s){
  const chips = (s.chips||[]).map(c=>'<button class="chip" data-act="chip" data-t="'+esc(c)+'">'+c+'</button>').join("");
  show(stageLevel("gertrudes",true)
   +'<div class="panel"><div class="q">'+s.q+'</div><div class="chips">'+chips+'</div>'
   +'<small>'+(CFG.FORMSPREE_URL?'💌 O que você escrever aqui será enviado para a Mary. É opcional.':'O que você escrever fica só neste aparelho. É opcional.')+'</small>'
   +'<input class="txt" id="ans" maxlength="240" placeholder="'+esc(s.ph||"")+'" value="'+esc(S.opt[s.id]||"")+'">'
   +'<div class="row"><button class="btn" data-act="asave">Guardar 💌</button><button class="btn sec" data-act="askip">Pular »</button></div></div>');
}
/* ---------- recompensa ---------- */
function screenReward(){
  const L=Run.L, id=Run.id;
  if(!S.done[id]){
    S.done[id]=true; S.hearts++; S.pts+=20; S.items.push({e:L.reward.e,n:L.reward.n});
    S.animFrom = S.pos; S.pos = id;
  }
  save(); if(id==="caminho") queueSend(); hud(L.title); burst(26); Snd.sfx("win");
  const last = id==="chico";
  show('<div class="stage single">'+(L.npc?'<div class="actor big" style="width:clamp(110px,36vw,160px)">'+sprite(L.npc)+'</div>':'<div class="bigemoji">🌸</div>')+'</div>'
   +'<div class="panel reward"><div class="rwe">'+L.reward.e+'</div><div class="q">Fase concluída!</div><div><b>Você ganhou:</b> '+L.reward.n+'<br><small>'+L.reward.t+'</small></div>'
   +'<div class="fb good" style="width:100%">💗 +1 coração · ✨ +20 pontos de afeto</div>'
   +'<button class="btn big" data-act="'+(last?"toReunion":"map")+'">'+(last?"Ir até a Mary 💕":"Voltar ao mapa 🗺️")+'</button></div>');
}
/* ---------- reencontro ---------- */
function screenReunion(){
  Run=null; setBG("garden"); hud("Jardim do Reencontro");
  runLines(REUNION, (w,d,b)=>'<div class="stage reun"><div class="hug"><div class="a '+(w==="mary"?"talk":"")+'">'+sprite("matheus")+'</div><div class="a m2 '+(w==="matheus"?"talk":"")+'">'+sprite("mary")+'</div><div class="bh">❤️</div></div>'
    +'<div class="pets"><div class="p" style="width:clamp(44px,13vw,64px)">'+sprite("gertrudes")+'</div><div class="p">'+sprite("luna")+'</div><div class="p" style="width:clamp(56px,17vw,86px)">'+sprite("frida")+'</div><div class="p">'+sprite("stella")+'</div><div class="p" style="width:clamp(44px,13vw,64px)">'+sprite("chico")+'</div></div></div>'
    +'<div class="panel" style="margin-top:84px">'+d+'<div class="row">'+b+'</div></div>',
    ()=>{ S.reunion=true; S.pts+=30; save(); burst(40); Snd.sfx("win"); screenLetterGate(); }, false);
  burst(18);
}
function screenLetterGate(){
  hud("Jardim do Reencontro");
  show('<div class="stage single"><div class="bigemoji">💌</div></div><div class="panel reward"><div class="q">Mary tem uma carta para você</div><div>Leia com calma. Não tem limite de tempo.</div><button class="btn big" data-act="letter">Abrir a carta 💌</button></div>');
}
function screenLetter(){
  if(!S.reunion){ toast("A carta só abre no fim da aventura 💌"); return screenMap(); }
  setBG("garden"); hud("Carta final");
  const ps = LETTER.map((p,i)=>'<p'+(i===LETTER.length-1?' class="sign"':'')+'>'+esc(p)+'</p>').join("");
  show('<div class="paper">'+ps+'</div><div class="letterbar"><button class="btn big" data-act="summary">Ver resumo da aventura ✨</button></div>');
  burst(6,["💗","💖","🌸"]);
}
function screenSummary(){
  queueSend(); setBG("castle"); hud("Resumo");
  const labels={sonho:"Sonho ao lado da Mary",lembranca:"Lembrança que faz sorrir",admira:"O que mais admiro",promessa:"Promessa para o futuro"};
  const ans = Object.keys(labels).filter(k=>S.opt[k]).map(k=>'<div class="ans"><b>'+labels[k]+':</b> '+esc(S.opt[k])+'</div>').join("");
  show('<div class="stage single" style="flex:0 0 22%"><div class="bigemoji" style="font-size:64px">🏆</div></div><div class="panel" style="max-height:78%">'
   +'<div class="q">Aventura completa! 🎉</div>'
   +'<div class="stat"><span>Fases concluídas</span><span>'+ORDER.filter(k=>S.done[k]).length+' / 5</span></div>'
   +'<div class="stat"><span>Desafios acertados</span><span>'+S.right+' / '+S.total+'</span></div>'
   +'<div class="stat"><span>Acertos de primeira</span><span>'+S.first+'</span></div>'
   +'<div class="stat"><span>Corações 💗</span><span>'+S.hearts+'</span></div>'
   +'<div class="stat"><span>Pontos de afeto ✨</span><span>'+S.pts+'</span></div>'
   +'<div class="stat"><span>Mochila</span><span>'+S.items.map(i=>i.e).join(" ")+'</span></div>'
   +(ans?'<div class="q" style="font-size:15px">As suas respostas 💞</div>'+ans+'<small>'+(CFG.FORMSPREE_URL?'(a Mary recebeu uma cópia)':'(ficam salvas só neste aparelho)')+'</small>':'')
   +'<div class="fb good">Matheus, você enfrentou ciúmes, brinquedos, petiscos suspeitos e um papagaio dramático, só para chegar até a Mary. Algumas jornadas valem cada passo. ❤️</div>'
   +'<div class="row"><button class="btn sec" data-act="letter">Reler a carta</button><button class="btn" data-act="reset">Jogar de novo</button></div>'
   +'<button class="btn sec" data-act="title">Voltar ao início</button></div>');
  burst(20);
}

/* ================================================================
   8) AÇÕES (cliques)
   ================================================================ */
const ACT = {
  start(){ Snd.init(); if(S.started && Object.keys(S.done).length){ screenMap(); } else if(S.started && S.reunion){ screenLetter(); } else if(S.started && Object.keys(S.done).length===0){ screenMap(); } else { screenIntro(); } },
  howto(){ howTo(); },
  close(){ closeModal(); },
  snd(){ Snd.toggle(); if(!Snd.ctx) toast("Seu navegador não permite áudio."); if(Run||LR||S.started){ if(HUD.classList.contains("off")) screenTitle(); else hud(document.querySelector(".ttl")?document.querySelector(".ttl").textContent:""); } else screenTitle(); },
  menu(){ modal('<h2>Menu</h2><button class="btn sec" data-act="howtoM">Como jogar</button><button class="btn sec" data-act="title2">Tela inicial</button><button class="btn" data-act="reset">Recomeçar do zero</button><button class="btn sec" data-act="close">Fechar</button>'); },
  howtoM(){ closeModal(); howTo(); },
  title2(){ closeModal(); screenTitle(); },
  title(){ screenTitle(); },
  reset(){ closeModal(); modal('<h2>Recomeçar?</h2><p>Todo o progresso e as respostas salvas neste aparelho serão apagados.</p><div class="row"><button class="btn sec" data-act="close">Cancelar</button><button class="btn" data-act="doReset">Sim, recomeçar</button></div>'); },
  doReset(){ closeModal(); S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} Run=null; LR=null; screenTitle(); },
  map(){ closeModal(); if(!S.started) return screenTitle(); screenMap(); },
  node(b){
    const id=b.dataset.id;
    if(b.classList.contains("lock")){ toast("Ainda bloqueado: conclua a fase anterior 🔒"); return; }
    if(id==="mary"){ if(S.reunion) return screenLetter(); return screenReunion(); }
    startLevel(id);
  },
  lr(){ if(LR.i<LR.lines.length-1){ LR.i++; drawLine(); } else { const d=LR.done; LR=null; d(); } },
  lrSkip(){ const d=LR.done; LR=null; d(); },
  pick(b){ onPick(b); },
  showans(){ showAnswer(); },
  qnext(){ next(); },
  fi(b,e){ e.stopPropagation(); onFound(b); },
  fmiss(b,e){ if(e.target.closest(".fi")) return; onMissFind(); },
  hint(){ const s=cur(); document.querySelectorAll(".fi:not(.got)").forEach(x=>x.classList.add("pulse")); document.getElementById("fb").innerHTML='🦜 <b>Gertrudes:</b> '+s.hint; },
  fskip(){ endFind(false); },
  chip(b){ document.getElementById("ans").value=b.dataset.t; commitAns(); },
  asave(){ const v=document.getElementById("ans").value.trim(); if(!v){ toast("Escreva ou escolha algo, ou toque em Pular."); return; } commitAns(); S.hearts++; S.pts+=5; save(); burst(8,["💌","💗"]); hud(Run.L.title); next(); },
  askip(){ commitAns(); next(); },
  toReunion(){ screenReunion(); },
  letter(){ screenLetter(); },
  summary(){ screenSummary(); }
};
document.addEventListener("input", e=>{
  if(e.target && e.target.id==="ans") commitAns();
});
document.addEventListener("click", e=>{
  Snd.init();
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if(fn) fn(b,e);
});

/* ================================================================
   9) INÍCIO
   ================================================================ */
screenTitle();
trySend();
</script>
</body>
</html>
